name: Android Existing Tests

on:
  push:
    branches: [main, 'class4/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-existing-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Existing JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install test JDK
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install daemon JDK
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Expose both toolchains
        run: |
          mkdir -p "$HOME/.gradle"
          printf '\norg.gradle.java.installations.paths=%s,%s\n' \
            '${{ steps.java21.outputs.path }}' \
            '${{ steps.java25.outputs.path }}' >> "$HOME/.gradle/gradle.properties"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run existing JVM suite
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Upload JVM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-jvm-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk

  device:
    name: Existing device tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install test JDK
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install daemon JDK
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Expose both toolchains
        run: |
          mkdir -p "$HOME/.gradle"
          printf '\norg.gradle.java.installations.paths=%s,%s\n' \
            '${{ steps.java21.outputs.path }}' \
            '${{ steps.java25.outputs.path }}' >> "$HOME/.gradle/gradle.properties"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Run existing device suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-device-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/